<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Zorgdomein Infused</title>
  <style>
    body {
      width: 240px;
      padding: 16px;
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f9fa;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .logo {
      height: 48px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin: 0;
    }

    .subtitle {
      font-size: 12px;
      color: #666;
      margin: 4px 0 0 0;
    }

    .button {
      width: 100%;
      padding: 12px;
      background: #1b75bb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .button:hover {
      background: #155d95;
    }

    .button.secondary {
      background: #e2e8f0;
      color: #333;
    }

    .button.secondary:hover {
      background: #cbd5e0;
    }

    #links {
      margin-bottom: 8px;
    }

    #links button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      margin-bottom: 4px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      background: white;
      font-size: 13px;
      cursor: pointer;
    }

    #links button:hover {
      border-color: #1b75bb;
      color: #1b75bb;
    }

    #links .empty {
      font-size: 12px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="zorgdomein.svg" alt="" class="logo">
    <h1 class="title">Zorgdomein Infused</h1>
    <p class="subtitle" id="version-text"></p>
  </div>

  <div id="links"></div>

  <button class="button" id="openZorgdomein">ZorgDomein openen</button>
  <button class="button secondary" id="openOptions">⚙️ Instellingen</button>

  <script src="popup.js"></script>
</body>
</html>
